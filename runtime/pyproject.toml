[project]
name = "ohv-agent-runtime"
version = "0.1.0"
description = "OH Ventures event-driven agent runtime around Hermes"
requires-python = ">=3.11"
dependencies = [
  "httpx>=0.27,<1",
  "pydantic>=2.7,<3",
  "pydantic-settings>=2.2,<3",
  "typer>=0.12,<1",
]

[project.scripts]
ohv = "ohv_runtime.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ohv_runtime"]
